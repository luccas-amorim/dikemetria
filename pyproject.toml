[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dikemetria"
version = "0.2.0"
description = "Jurimetria aberta: medir padrões em decisões judiciais públicas."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luccas de Amorim" }]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dikemetria = "dikemetria.cli:main"

[tool.setuptools.packages.find]
include = ["dikemetria*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
